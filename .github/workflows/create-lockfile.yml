name: Generate and validate npm lockfile

on:
  push:
    branches:
      - maintenance/dependency-lockfile

permissions:
  contents: write

jobs:
  lockfile:
    name: Generate lockfile, audit and verify build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exactly from lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify patched PostCSS
        run: |
          npm ls postcss --all
          node -e "const p=require(require.resolve('postcss/package.json',{paths:[require.resolve('next/package.json')]}));console.log('PostCSS resolved by Next.js:',p.version);if(p.version!=='8.5.33')process.exit(1)"
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npm run lint
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build
      - name: Commit generated lockfile to maintenance branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add npm lockfile for reproducible installs"
            git push origin HEAD:$GITHUB_REF_NAME
          else
            echo "package-lock.json is already up to date."
          fi
