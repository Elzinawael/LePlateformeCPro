name: ConduiPRO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, dependency audit and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify patched PostCSS dependency
        run: |
          npm ls postcss --all
          node -e "const p=require(require.resolve('postcss/package.json',{paths:[require.resolve('next/package.json')]}));console.log('PostCSS resolved by Next.js:',p.version);if(p.version!=='8.5.33')process.exit(1)"
      - name: Audit all installed dependencies
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build
